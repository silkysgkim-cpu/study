<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Table 태그 예제</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      caption {
        caption-side: top;
        font-weight: bold;
        font-size: 1.2em;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>HTML Table 태그 예제</h1>
    <table>
        <caption>학생 성적표</caption>
       <thead>
           <tr>
                <th scope="col">학생</th>
                <th scope="col">영어</th>
                <th scope="col">수학</th>
           </tr>
       </thead>
        <tbody>
            <tr>
                <th>라이캣</th>
                <td>100</td>
                <td rowspan="2">90</td>
                <!-- 두개의 행이 병합된다. -->
            </tr>
            <tr>
                <th>로지</th>
                <td>80</td>
                <!-- 행을 병합해주었기 때문에 원래 있던 td태그는 지워줌 -->
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <!-- 두개의 열이 병합된다. -->
                <th>평균</th>
                <td colspan="2">90</td>
                <!-- <td>90</td> -->
            </tr>
        </tfoot>
    </table>
  </body>
</html>

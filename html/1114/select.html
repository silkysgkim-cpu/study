<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>select</title>
  </head>
  <body>
    <!-- multiple : 여러가지 multiple size="2" 두개까지만 보여짐-->
    <select name="" id="" multiple size="2">
        <option value="FE" selected>프론트엔드</option>
        <option value="BE">백엔드</option>
        <option value="DA">데이터분석</option>
                <label for="language">사용하는 개발 언어를 선택하세요</label>
        <select id="language" name="language">
        <optgroup label="프로그래밍 언어">
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="java">Java</option>
            <option value="csharp">C#</option>
        </optgroup>
        <optgroup label="데이터베이스">
            <option value="mysql">MySQL</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="mongodb">MongoDB</option>
            <option value="sqlite">SQLite</option>
        </optgroup>
        </select>
    </select>
  </body>
</html>

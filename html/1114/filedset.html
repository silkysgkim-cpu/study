<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <!-- 연결해주기 label의 for와 input의 id -->
     <!-- name속성을 사용하면 같은 field라는 것을 알려주게됨 -->
      <fieldset>
        <legend>성별</legend>
        <input type="radio" id="male" name="gender"/>
        <label for="male">남성</label>
        <input type="radio" id="female" name="gender"/>
        <label for="female">여성</label>
      </fieldset>
    
      <fieldset>
        <legend>사용 기술</legend>
        <input type="checkbox" id="html" name="skill">
        <label for="html" name="html">HTML</label>
        <input type="checkbox" id="css" name="skill">
        <label for="css" name="css">CSS</label>
      </fieldset>
    
  </body>
</html>

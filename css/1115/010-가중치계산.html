<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    /* 클래스 + 유형 선택자 */
    /* 점수 10점 + 1점 = 11점 */
    .ul a {
    color: yellow;
    }
    
    /* 클래스 선택자 */
    /* 10점 */
    .click {
    color: green;
    background: black;
    }
    
    /* 유형 선택자 */
    /* 총 12점 */
    html body main section article div ul li p strong span a {
        /* 3. 중요성의 원칙 */
    background: purple;
    color: blue;
    }
  </style>
  <body>
    <main>
  <section>
    <article>
      <div>
        <ul class="ul">
          <li>
            <p>
              <strong>
                <span>
                  <a href="#" class="click">
                    1. 이 글자는 어떤 색일까요? 2. 배경색은 어떤 색일까요?
                  </a>
                </span>
              </strong>
            </p>
          </li>
        </ul>
      </div>
    </article>
  </section>
</main>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
        .parent {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .parent div {
            width: 100px;
            height: 100px;
            background-color: cornflowerblue;
        }
        .box1 {
            border-radius: 50%;
        }
        .box2 {
            border-radius: 10px;
        }
        .box3 {
            border-radius: 100% 0 0 0
        }
        .box4 {
            border-radius: 100% 0 100% 0;
        }
        .box5 {
            border-radius: 0 50% 0;
        }
        .box6 {
            box-sizing: border-box;
            border-radius: 50%;
            border-bottom: 50px solid white;
        }
    </style>
  </head>
  <body>
    <div class="parent">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    <div class="box6"></div>
    </div>
  </body>
</html>

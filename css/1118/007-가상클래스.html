<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
        /* 방문하지 않은 링크 */
        a:link {
            color: chartreuse;
        }
        a:visited {
            color: cadetblue;
        }
        /* 마우스가 올라간 상태 */
        button:hover {
            background-color: lightblue;
            border: solid 3px blue;
        }

        /* 마우스가 클릭되고 있는 상태 */
        button:active {
            background-color: coral;
        }
    </style>
  </head>
  <body>
    <a class="weniv" href="https://weniv.co.kr">위니브 메인 페이지</a>
    <a class="naver" href="https://naver.com">네이버 메인 페이지</a>

    <button>Click Me!</button>
  </body>
</html>

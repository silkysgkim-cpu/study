<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .keyword {
        color: cadetblue;
      }

      .hex {
        color: #ff00ff;
        color: #ffaa00aa;
      }
      .rgb {
        color: rgb(0, 0, 255);
      }
      .rgba {
        color: rgba(255, 0, 0, 0.5);
      }
      .current-color {
        /* color: greenyellow; */
        /* 명시되지 않은 경우: 부모에게서 상속받은 color값을 사용 */
        border: solid 5px currentColor;
      }

      .color {
        color: hotpink;
      }
    </style>
  </head>
  <body>
    <div>
        <p class="keyword">키워드로 설정한 색상</p>
        <p class="hex">HEX 코드로 설정한 색상</p>
        <p class="rgb">RGB로 설정한 색상</p>
        <p class="rgba">RGBA로 설정한 색상</p>
        <p class="current-color">currentColor</p>
    </div>
    
  </body>
</html>

<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        /* 카드 기본 스타일 */
        section .card {
            padding: 15px;
            display: inline-block;
            margin: 10px;
            border-radius: 10px;
            background-color: #eee;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.15)
        }

        section :nth-child(1) {
            background-color: salmon;
        }

        section .card:nth-child(2){
            background-color: orange;
        }

        section .card:nth-child(3) {
            background-color: rgb(202, 165, 85);
        }

        section .card:nth-child(4){
            background-color: lightgreen;
        }
        section .card:nth-child(5){
            background-color: skyblue;
        }
        section .card:nth-child(6){
            background-color: blue;
        }
        section .card:first-child {
            border: 5px dashed green;
        }
        section .card:last-child {
            border: 5px dashed midnightblue
        }


        /* section .card:is(:first-child, :last-child) */
        
        section .card:nth-child(even) {
            color: white;
        }

        .team-list {
            list-style: none;
        }
        
        .team-list li:first-child::marker {
            content: "🌟";
        }

        .team-list li:not(:first-child)::marker {
            content: "✅";

        }
    
        .team-list li::after {
            content: "팀원";
            color: #888;
            font-size: 0.8em
        }
        .team-list li:not(:first-child)::after {
            content:"팀장";
            color: red;
        }
    </style>
  </head>
  <body>
    <h1>프로젝트 팀 카드</h1>

        <section>
            <div class="card">HTML</div>
            <div class="card">CSS</div>
            <div class="card">JavaScript</div>
            <div class="card">React</div>
            <div class="card">TypeScript</div>
            <div class="card">Next.js</div>
        </section>

    <h2>팀원 목록</h2>
        <ul class="team-list">
            <li>로지<span>팀장</span></li>
            <li>하티<span>팀원</span></li>
            <li>지지<span>팀원</span></li>
            <li>웨이드<span>팀원</span></li>
            <li>빙키<span>팀원</span></li>
            <li>라이캣<span>팀원</span></li>
        </ul>
  </body>
</html>
